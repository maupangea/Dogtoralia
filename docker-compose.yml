services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64          # Apple Silicon runs mssql under Rosetta emulation
    container_name: dogtoralia-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "T4bEtt@BLoeumGK"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - dogtoralia-mssql-data:/var/opt/mssql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # One-shot: creates the "Serilog" logging database the MVC app needs (not covered
  # by EF migrations). Runs once SQL Server is healthy, then exits.
  mssql-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: "T4bEtt@BLoeumGK"
    volumes:
      - ./docker/mssql-init.sh:/mssql-init.sh:ro
    entrypoint: ["/bin/bash", "/mssql-init.sh"]
    restart: "no"

volumes:
  dogtoralia-mssql-data:
